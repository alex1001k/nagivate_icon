<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Все отклонения</title>
<style>
:root{
  --forest:#12352A; --forest-2:#1B4A3A; --ink:#1A211E; --paper:#F7F6F2;
  --card:#FFFFFF; --line:#E2E0D9; --line-soft:#EDEBE4; --stone:#787E79;
  --moss:#3E7D4F; --amber:#B8860B; --crimson:#A8321F; --slate:#4A6E8A;
  --crit:#C0392B; --sig:#C99A2E; --low:#4A6E8A;
}
html.dark{
  --forest:#4FBF87; --forest-2:#6FD4A0; --ink:#EDEEEA; --paper:#141815;
  --card:#1D2320; --line:#323830; --line-soft:#282E29; --stone:#8B9289;
  --moss:#4FBF87; --amber:#E0B84F; --crimson:#E8776A; --slate:#7FA8C9;
  --crit:#E8776A; --sig:#E0B84F; --low:#7FA8C9;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Inter','Segoe UI',system-ui,sans-serif;
  background:var(--paper);color:var(--ink);font-size:13px;line-height:1.4;
  transition:background .2s,color .2s;
}

/* ── Шапка ── */
.top{
  display:flex;align-items:center;gap:14px;padding:10px 24px;
  border-bottom:1px solid var(--line);background:var(--card);
  position:sticky;top:0;z-index:30;
}
.back-btn,.theme-btn{
  width:30px;height:30px;border-radius:8px;border:1px solid var(--line);
  background:var(--card);color:var(--stone);cursor:pointer;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
}
.back-btn:hover,.theme-btn:hover{border-color:var(--forest);color:var(--forest)}
.top h1{font-size:13.5px;font-weight:600}
.top-meta{margin-left:auto;font-size:11px;color:var(--stone);display:flex;align-items:center;gap:7px}
.top-meta i{width:6px;height:6px;border-radius:50%;background:var(--moss);display:block}
.theme-btn svg{width:15px;height:15px}
.theme-btn .sun{display:none}
html.dark .theme-btn .moon{display:none}
html.dark .theme-btn .sun{display:block}

.wrap{max-width:900px;margin:0 auto;padding:16px 24px 40px}

/* ── Заголовок ── */
.page-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px}
.page-title{font-size:17px;font-weight:600;letter-spacing:-.01em}
.summary-row{display:flex;gap:6px}
.summary-chip{
  display:flex;align-items:center;gap:5px;padding:4px 9px;border-radius:7px;
  border:1px solid var(--line);background:var(--card);font-size:11px;
}
.summary-chip b{font-size:12.5px;font-variant-numeric:tabular-nums}
.summary-chip .dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* ══ ФИЛЬТРЫ — компактно, без переполнения ══ */
.filters{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  margin-bottom:12px;
}
.f-select{
  padding:7px 30px 7px 11px;border:1.5px solid var(--line);border-radius:8px;
  background:var(--paper) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="%23787E79" stroke-width="2.5"><path d="M6 9l6 6 6-6"/></svg>') no-repeat right 10px center;
  color:var(--ink);font-family:inherit;font-size:12px;
  outline:none;cursor:pointer;transition:border-color .15s;
  appearance:none;-webkit-appearance:none;
}
.f-select:focus{border-color:var(--forest)}

/* Кнопка-календарь с попапом */
.date-wrap{position:relative}
.date-btn{
  width:34px;height:34px;border-radius:8px;border:1.5px solid var(--line);
  background:var(--paper);color:var(--stone);cursor:pointer;
  display:flex;align-items:center;justify-content:center;transition:all .15s;
  position:relative;
}
.date-btn:hover{border-color:var(--forest);color:var(--forest)}
.date-btn.active{border-color:var(--forest);color:var(--forest);background:var(--line-soft)}
.date-btn svg{width:16px;height:16px}
.date-btn .badge{
  position:absolute;top:-4px;right:-4px;width:8px;height:8px;border-radius:50%;
  background:var(--forest);display:none;
}
.date-btn.has-range .badge{display:block}

.date-popover{
  display:none;position:absolute;top:calc(100% + 6px);left:0;z-index:40;
  background:var(--card);border:1px solid var(--line);border-radius:10px;
  padding:14px;box-shadow:0 8px 24px rgba(0,0,0,.12);width:240px;
}
.date-popover.show{display:block}
.date-popover-label{font-size:10.5px;font-weight:700;color:var(--stone);text-transform:uppercase;letter-spacing:.04em;margin-bottom:8px}
.date-row{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.date-field{display:flex;flex-direction:column;gap:3px}
.date-field label{font-size:10.5px;color:var(--stone)}
.date-field input{
  padding:7px 9px;border:1.5px solid var(--line);border-radius:7px;
  background:var(--paper);color:var(--ink);font-family:inherit;font-size:12px;outline:none;
}
.date-field input:focus{border-color:var(--forest)}
.date-actions{display:flex;gap:6px}
.date-actions button{
  flex:1;padding:7px;border-radius:7px;font-size:11.5px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;border:1px solid var(--line);
}
.date-apply{background:var(--forest);color:#fff;border-color:var(--forest)}
html.dark .date-apply{color:#0C1A12}
.date-apply:hover{background:var(--forest-2)}
.date-clear{background:none;color:var(--stone)}
.date-clear:hover{border-color:var(--forest);color:var(--forest)}

.f-reset{
  padding:7px 12px;border-radius:8px;border:1px dashed var(--line);
  background:none;color:var(--stone);font-size:12px;cursor:pointer;
  font-family:inherit;transition:all .15s;margin-left:auto;
}
.f-reset:hover{border-color:var(--forest);color:var(--forest)}

/* ── Сортировка ── */
.sort-bar{display:flex;align-items:center;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.sort-label{font-size:11px;color:var(--stone);margin-right:2px}
.sort-btn{
  padding:5px 12px;border-radius:14px;border:1px solid var(--line);
  background:var(--card);color:var(--stone);font-size:11px;font-weight:600;
  cursor:pointer;font-family:inherit;transition:all .15s;
}
.sort-btn:hover{border-color:var(--forest);color:var(--forest)}
.sort-btn.on{background:var(--forest);border-color:var(--forest);color:#fff}
html.dark .sort-btn.on{color:#0C1A12}
.result-count{margin-left:auto;font-size:11px;color:var(--stone)}

/* ══ КАРТОЧКИ — статус-полоса слева, без лишнего ══ */
.feed{display:flex;flex-direction:column;gap:6px}
.dev-card{
  background:var(--card);border:1px solid var(--line);border-left:3px solid var(--line);
  border-radius:8px;padding:11px 14px;transition:border-color .15s;
}
.dev-card.crit{border-left-color:var(--crit)}
.dev-card.sig{border-left-color:var(--sig)}
.dev-card.low{border-left-color:var(--low)}

.dev-row1{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.dev-name{font-size:14px;font-weight:600;flex:1;min-width:0}
.dev-name .val{font-variant-numeric:tabular-nums}
.dev-name .plan-inline{font-size:12px;font-weight:400;color:var(--stone);margin-left:5px}
.dev-dur{font-size:11px;color:var(--stone);font-weight:600;white-space:nowrap;flex-shrink:0}

.dev-row2{display:flex;align-items:center;gap:10px}
.dev-detail{flex:1;min-width:0;font-size:12px;color:var(--stone);line-height:1.4}
.dev-detail b{color:var(--ink);font-weight:600}
.dev-link{
  color:var(--slate);font-weight:600;text-decoration:none;font-size:11px;
  display:inline-flex;align-items:center;gap:4px;white-space:nowrap;flex-shrink:0;
}
.dev-link:hover{text-decoration:underline}
.dev-link svg{width:11px;height:11px}

.no-results{padding:40px 20px;text-align:center;color:var(--stone);font-size:12.5px;
  background:var(--card);border:1px solid var(--line);border-radius:10px;}

@media(max-width:640px){
  .dev-row2{flex-direction:column;align-items:flex-start;gap:4px}
}
</style>
</head>
<body>

<div class="top">
  <button class="back-btn" onclick="history.back()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
  </button>
  <h1>Все отклонения</h1>
  <span class="top-meta"><i></i>Данные на 16.08.2026, 06:40</span>
  <button class="theme-btn" onclick="toggleTheme()" aria-label="Переключить тему">
    <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1111.2 3 7 7 0 0021 12.8z"/></svg>
    <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
  </button>
</div>

<div class="wrap">

  <div class="page-head">
    <div class="page-title">Реестр отклонений</div>
    <div class="summary-row" id="summaryRow"></div>
  </div>

  <!-- ══ ФИЛЬТРЫ ══ -->
  <div class="filters">
    <select class="f-select" id="fUser">
      <option value="all">Все пользователи</option>
      <option value="ruk-vklady">Рук. «Вклады»</option>
      <option value="ruk-platezhi">Рук. «Платежи ФЛ»</option>
      <option value="fin-dir">Финансовый директор</option>
      <option value="ruk-private">Рук. Private Banking</option>
      <option value="ruk-it">Директор IT-инфраструктуры</option>
      <option value="ruk-marketing">Рук. маркетинга</option>
    </select>

    <select class="f-select" id="fReport">
      <option value="all">Все отчёты</option>
      <option value="platezhi-fl">Платежи ФЛ</option>
      <option value="vklady">Вклады</option>
      <option value="ipoteka">Ипотека</option>
      <option value="opex">Операционные расходы</option>
      <option value="clients">Клиентская база</option>
    </select>

    <select class="f-select" id="fSev">
      <option value="all">Любая критичность</option>
      <option value="crit">Критично</option>
      <option value="sig">Значительно</option>
      <option value="low">Незначительно</option>
    </select>

    <div class="date-wrap">
      <button class="date-btn" id="dateBtn" onclick="toggleDatePopover(event)" aria-label="Период">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span class="badge"></span>
      </button>
      <div class="date-popover" id="datePopover">
        <div class="date-popover-label">Период обнаружения</div>
        <div class="date-row">
          <div class="date-field">
            <label>С</label>
            <input type="date" id="fDateFrom"/>
          </div>
          <div class="date-field">
            <label>По</label>
            <input type="date" id="fDateTo"/>
          </div>
        </div>
        <div class="date-actions">
          <button class="date-clear" onclick="clearDateRange()">Очистить</button>
          <button class="date-apply" onclick="applyDateRange()">Применить</button>
        </div>
      </div>
    </div>

    <button class="f-reset" onclick="resetFilters()">Сбросить</button>
  </div>

  <!-- ══ СОРТИРОВКА ══ -->
  <div class="sort-bar">
    <span class="sort-label">Сортировать:</span>
    <button class="sort-btn on" data-sort="sev">Критичность</button>
    <button class="sort-btn" data-sort="report">Отчёт</button>
    <button class="sort-btn" data-sort="dur">Длина тренда</button>
    <button class="sort-btn" data-sort="name">Название</button>
    <span class="result-count" id="resultCount"></span>
  </div>

  <!-- ══ ЛЕНТА ══ -->
  <div class="feed" id="feed"></div>
  <div class="no-results" id="noResults" style="display:none">Ничего не найдено под текущие фильтры</div>

</div>

<script>
const REPORTS_FULL = {
  'platezhi-fl': 'Платежи ФЛ',
  'vklady': 'Вклады',
  'ipoteka': 'Ипотека',
  'opex': 'Операционные расходы',
  'clients': 'Клиентская база',
};
const SEV_ORDER = { crit:3, sig:2, low:1 };

const DATA = [
  { metric:'Комиссионный доход', report:'vklady', value:'18,2 млн', plan:'план 25 млн', devText:'на 27% ниже плана и выход за 3σ', sev:'crit', durText:'2-й месяц подряд', durDays:62, user:'ruk-vklady', daysAgo:1, navId:'REP-4471' },
  { metric:'Доходность вклада', report:'vklady', value:'3,1%', plan:'план 4,5%', devText:'на 31% ниже плана', sev:'crit', durText:'3-й месяц подряд', durDays:93, user:'ruk-vklady', daysAgo:0, navId:'REP-4471' },
  { metric:'Отток Premium', report:'clients', value:'4,2%', plan:'норма 2,4%', devText:'выход за 3σ от нормы', sev:'crit', durText:'5 дней подряд', durDays:5, user:'ruk-private', daysAgo:1, navId:'REP-4475' },
  { metric:'Операционные расходы', report:'opex', value:'612 млрд', plan:'бюджет 577 млрд', devText:'на 6% выше бюджета и выход за 2σ', sev:'crit', durText:'6 недель подряд', durDays:42, user:'fin-dir', daysAgo:0, navId:'REP-4401' },
  { metric:'Облачная инфраструктура', report:'opex', value:'+18% к бюджету', plan:'бюджет статьи', devText:'на 18% выше бюджета статьи', sev:'crit', durText:'5 недель подряд', durDays:35, user:'ruk-it', daysAgo:2, navId:'REP-4401' },
  { metric:'Открыто вкладов', report:'vklady', value:'5,7 тыс.', plan:'план 6,5 тыс.', devText:'на 12% ниже плана', sev:'sig', durText:'2 недели подряд', durDays:14, user:'ruk-vklady', daysAgo:2, navId:'REP-4471' },
  { metric:'Стоимость фондирования', report:'vklady', value:'6,1%', plan:'норма 5,7%', devText:'выход за 2σ от нормы', sev:'sig', durText:'3 недели подряд', durDays:21, user:'fin-dir', daysAgo:3, navId:'REP-4401' },
  { metric:'Жалобы по продукту', report:'vklady', value:'142', plan:'норма ~90', devText:'выход за 2σ от нормы', sev:'sig', durText:'впервые за период', durDays:1, user:'ruk-vklady', daysAgo:1, navId:'REP-4471' },
  { metric:'Конверсия платежей', report:'platezhi-fl', value:'2,4%', plan:'план 2,9%', devText:'на 18% ниже плана', sev:'sig', durText:'9 дней подряд', durDays:9, user:'ruk-platezhi', daysAgo:1, navId:'REP-4501' },
  { metric:'Доля отклонённых платежей', report:'platezhi-fl', value:'1,8%', plan:'норма 1,2%', devText:'выход за 2σ от нормы', sev:'sig', durText:'6 дней подряд', durDays:6, user:'ruk-platezhi', daysAgo:1, navId:'REP-4501' },
  { metric:'Незапланированный найм в IT', report:'opex', value:'+14 FTE', plan:'план +9 FTE', devText:'на 9% выше плана', sev:'sig', durText:'4 недели подряд', durDays:28, user:'ruk-it', daysAgo:6, navId:'REP-4401' },
  { metric:'Стоимость привлечения (CAC)', report:'clients', value:'4 380 ₽', plan:'план 3 800 ₽', devText:'на 15% выше плана и выход за 2σ', sev:'sig', durText:'18 дней подряд', durDays:18, user:'ruk-marketing', daysAgo:2, navId:'REP-4477' },
  { metric:'Средний чек платежа', report:'platezhi-fl', value:'3 240 ₽', plan:'норма 3 400 ₽', devText:'выход за 1.5σ от нормы', sev:'low', durText:'3 дня подряд', durDays:3, user:'ruk-platezhi', daysAgo:0, navId:'REP-4501' },
  { metric:'SLA обработки платежа', report:'platezhi-fl', value:'94,1%', plan:'план 98%', devText:'на 4 п.п. ниже плана', sev:'low', durText:'2 дня подряд', durDays:2, user:'ruk-platezhi', daysAgo:0, navId:'REP-4501' },
  { metric:'Доля мобильных платежей', report:'platezhi-fl', value:'61%', plan:'норма 66%', devText:'выход за 1.5σ от нормы', sev:'low', durText:'4 дня подряд', durDays:4, user:'ruk-platezhi', daysAgo:2, navId:'REP-4501' },
  { metric:'Портфель ипотеки', report:'ipoteka', value:'184 млрд', plan:'план 170 млрд', devText:'на 8% выше плана', sev:'low', durText:'1 месяц подряд', durDays:30, user:'ruk-vklady', daysAgo:4, navId:'REP-4474' },
  { metric:'Просрочка портфеля ипотеки', report:'ipoteka', value:'1,4%', plan:'норма 1,2%', devText:'выход за 1.5σ от нормы', sev:'low', durText:'2 недели подряд', durDays:14, user:'fin-dir', daysAgo:3, navId:'REP-4474' },
  { metric:'NPS по продукту (Вклады)', report:'vklady', value:'71', plan:'норма 67', devText:'выход за 1.5σ от нормы', sev:'low', durText:'неделя подряд', durDays:7, user:'ruk-vklady', daysAgo:2, navId:'REP-4471' },
  { metric:'Отток массового сегмента', report:'clients', value:'1,8%', plan:'норма 1,5%', devText:'выход за 1.5σ от нормы', sev:'low', durText:'10 дней подряд', durDays:10, user:'ruk-private', daysAgo:5, navId:'REP-4478' },
  { metric:'ARPU Premium', report:'clients', value:'42 тыс.', plan:'план 43 тыс.', devText:'на 2% ниже плана', sev:'low', durText:'12 дней подряд', durDays:12, user:'ruk-private', daysAgo:4, navId:'REP-4475' },
];

let currentSort = 'sev';
let dateFrom = '', dateTo = '';

function renderSummary(){
  const counts = { crit:0, sig:0, low:0 };
  DATA.forEach(d=>counts[d.sev]++);
  document.getElementById('summaryRow').innerHTML = `
    <div class="summary-chip"><span class="dot" style="background:var(--crit)"></span><b>${counts.crit}</b></div>
    <div class="summary-chip"><span class="dot" style="background:var(--sig)"></span><b>${counts.sig}</b></div>
    <div class="summary-chip"><span class="dot" style="background:var(--low)"></span><b>${counts.low}</b></div>
    <div class="summary-chip">Всего <b>${DATA.length}</b></div>
  `;
}

function applyFilters(){
  const user = document.getElementById('fUser').value;
  const report = document.getElementById('fReport').value;
  const sev = document.getElementById('fSev').value;

  let rows = DATA.filter(d => {
    if(user!=='all' && d.user!==user) return false;
    if(report!=='all' && d.report!==report) return false;
    if(sev!=='all' && d.sev!==sev) return false;
    if(dateFrom || dateTo){
      const rowDate = new Date(2026,7,16); rowDate.setDate(rowDate.getDate()-d.daysAgo);
      if(dateFrom && rowDate < new Date(dateFrom)) return false;
      if(dateTo && rowDate > new Date(dateTo)) return false;
    }
    return true;
  });

  rows.sort((a,b) => {
    if(currentSort==='sev') return SEV_ORDER[b.sev]-SEV_ORDER[a.sev];
    if(currentSort==='report') return REPORTS_FULL[a.report].localeCompare(REPORTS_FULL[b.report],'ru');
    if(currentSort==='dur') return b.durDays-a.durDays;
    if(currentSort==='name') return a.metric.localeCompare(b.metric,'ru');
    return 0;
  });

  renderFeed(rows);
}

function renderFeed(rows){
  const feed = document.getElementById('feed');
  const noRes = document.getElementById('noResults');
  document.getElementById('resultCount').textContent = `${rows.length} из ${DATA.length}`;

  if(rows.length===0){
    feed.innerHTML='';
    noRes.style.display='block';
    return;
  }
  noRes.style.display='none';

  feed.innerHTML = rows.map(d => `
    <div class="dev-card ${d.sev}">
      <div class="dev-row1">
        <span class="dev-name">${d.metric}: <span class="val">${d.value}</span><span class="plan-inline">(${d.plan})</span></span>
      </div>
      <div class="dev-row2">
        <span class="dev-detail">${d.devText}. Длительность отклонения: <b>${d.durText}</b>.</span>
        <a class="dev-link" href="#" onclick="return false">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><path d="M15 3h6v6"/><path d="M10 14L21 3"/></svg>
          ${d.navId}
        </a>
      </div>
    </div>
  `).join('');
}

function resetFilters(){
  document.getElementById('fUser').value='all';
  document.getElementById('fReport').value='all';
  document.getElementById('fSev').value='all';
  clearDateRange();
  applyFilters();
}

document.getElementById('fUser').addEventListener('change', applyFilters);
document.getElementById('fReport').addEventListener('change', applyFilters);
document.getElementById('fSev').addEventListener('change', applyFilters);

document.querySelectorAll('.sort-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('on'));
    btn.classList.add('on');
    currentSort = btn.dataset.sort;
    applyFilters();
  });
});

/* ── Попап календаря ── */
function toggleDatePopover(e){
  e.stopPropagation();
  document.getElementById('datePopover').classList.toggle('show');
}
document.addEventListener('click', (e)=>{
  const pop = document.getElementById('datePopover');
  const btn = document.getElementById('dateBtn');
  if(pop.classList.contains('show') && !pop.contains(e.target) && e.target!==btn){
    pop.classList.remove('show');
  }
});
function applyDateRange(){
  dateFrom = document.getElementById('fDateFrom').value;
  dateTo = document.getElementById('fDateTo').value;
  const btn = document.getElementById('dateBtn');
  btn.classList.toggle('has-range', !!(dateFrom||dateTo));
  document.getElementById('datePopover').classList.remove('show');
  applyFilters();
}
function clearDateRange(){
  dateFrom = ''; dateTo = '';
  document.getElementById('fDateFrom').value='';
  document.getElementById('fDateTo').value='';
  document.getElementById('dateBtn').classList.remove('has-range');
  document.getElementById('datePopover').classList.remove('show');
  applyFilters();
}

function toggleTheme(){
  document.documentElement.classList.toggle('dark');
  try{localStorage.setItem('theme', document.documentElement.classList.contains('dark')?'dark':'light')}catch(e){}
}
try{ if(localStorage.getItem('theme')==='dark') document.documentElement.classList.add('dark'); }catch(e){}

renderSummary();
applyFilters();
</script>
</body>
</html>
